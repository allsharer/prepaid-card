<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prepaid Card Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .navbar { background: #1a2e4a !important; }
    .balance-card { background: linear-gradient(135deg, #1a2e4a, #2d5a8e); color: #fff; }
    .balance-card .amount { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
    .badge-receipt { background: #d1fae5; color: #065f46; }
    .badge-payment { background: #fee2e2; color: #991b1b; }
    .amount-receipt { color: #065f46; }
    .amount-payment { color: #991b1b; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-credit-card-2-front me-2"></i>Prepaid Card</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/transactions/add"><i class="bi bi-plus-circle me-1"></i>Add Transaction</a></li>
          <li class="nav-item"><a class="nav-link" href="/companies"><i class="bi bi-building me-1"></i>Companies</a></li>
          <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-bar-chart me-1"></i>Reports</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function ping() { fetch('/ping', {method: 'POST'}).catch(() => {}); }
    ping();
    setInterval(ping, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
